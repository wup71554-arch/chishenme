<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E8734A">
  <title>今天吃什么</title>
  <meta name="description" content="别纠结了，让它替你决定今天吃什么。">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header>
    <h1>今天吃什么</h1>
    <p class="sub">别纠结了，让它替你决定</p>
  </header>

  <!-- 偏好设置 -->
  <section class="panel">

    <div class="field">
      <label>这一餐是</label>
      <div class="chips" id="mealChips"></div>
    </div>

    <div class="field">
      <label>想吃点什么口味的</label>
      <div class="chips" id="tasteChips"></div>
    </div>

    <div class="field">
      <label>不吃的（可多选）</label>
      <div class="chips" id="avoidChips"></div>
    </div>

    <div class="field">
      <label class="switch">
        <input type="checkbox" id="vegToggle">
        <span>我吃素</span>
      </label>
    </div>

  </section>

  <!-- 生成按钮 -->
  <button class="roll" id="rollBtn">🎲 给我一个搭配</button>

  <!-- 结果 -->
  <section class="result" id="result" hidden>
    <div class="result-head">
      <span class="result-title">这一餐吃这些</span>
      <button class="ghost" id="rerollBtn">换一个 ↻</button>
    </div>
    <div id="dishes"></div>
    <p class="hint" id="hint" hidden></p>
  </section>

  <!-- 最近记录 -->
  <section class="history" id="history" hidden>
    <h2>最近吃过的</h2>
    <ul id="historyList"></ul>
  </section>

  <footer>
    搭配只是随机建议，不是营养处方，别太当真<br>
    <button id="clearBtn">清空我的设置和历史</button>
  </footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
